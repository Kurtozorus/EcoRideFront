<div class="signin-scene container-fluid">
  <div class="signin-scene-content">
    <div class="big-title-signin text-center">
      <h2 class="text-primary background-big-title">
        Partagez votre trajet, économisez et roulez plus vert
      </h2>
      <p class="text-primary background-big-title">
        Trouver le covoiturage qui vous convient !
      </p>
    </div>
  </div>
</div>
<div class="signin-main-content">
  <div class="container">
    <div class="row d-flex justify-content-center">
      <div class="col-md-4 mt-5">
        <form id="signinForm" class="p-4 rounded">
          <div class="form-group mb-3">
            <label class="pb-1" for="emailInput">Email</label>
            <input
              type="email"
              class="form-control"
              id="emailInput"
              name="email"
              placeholder="Entrer votre email"
            />
          </div>
          <div class="form-group mb-3">
            <label class="pb-1" for="passwordInput">Password</label>
            <input
              type="password"
              class="form-control"
              id="passwordInput"
              name="password"
              placeholder="Entrer votre password"
            />
            <div class="invalid-feedback">
              Votre email ou votre mot de passe est incorrect.
            </div>
          </div>
          <div class="d-flex justify-content-center pt-3">
            <button
              type="button"
              id="btn-signin"
              class="btn btn-secondary text-center"
            >
              Se connecter
            </button>
          </div>
          <div class="text-center pt-4">
            <a class="typoserif" href="/inscription"
              >Vous n'avez pas de compte ? inscrivez-vous ici !</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
